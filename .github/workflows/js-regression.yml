name: JavaScript regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
      - name: Audio timing regression tests
        run: node tests/audio-timing-core.test.js
      - name: Shared DSP regression tests
        run: node tests/mix-dsp-core.test.js
      - name: Voiceover competition package tests
        run: node tests/voiceover-competition-package-core.test.js
      - name: Voiceover ducking render tests
        run: node tests/voiceover-ducking-render-core.test.js
      - name: Voiceover Smart Mix preservation tests
        run: node tests/voiceover-smart-mix-preview-preservation.test.js
      - name: Competition voiceover clarity processing tests
        run: node tests/voiceover-processing-core.test.js
      - name: Voiceover loudness analysis tests
        run: node tests/voiceover-loudness-analysis-core.test.js
      - name: Automatic voiceover loudness integration tests
        run: node tests/voiceover-auto-loudness.test.js
      - name: Voiceover loudness to competition processing integration
        run: node tests/voiceover-loudness-processing.integration.test.js
      - name: Competition master input contract tests
        run: node tests/competition-master-input-core.test.js
      - name: Rendered competition master metrics tests
        run: node tests/competition-master-metrics-core.test.js
      - name: Post-mix competition clarity metrics tests
        run: node tests/competition-master-clarity-metrics-core.test.js
      - name: Competition master export readiness bridge tests
        run: node tests/competition-master-export-readiness-core.test.js
      - name: Competition master final check tests
        run: node tests/competition-master-final-check-core.test.js
      - name: Competition master assessment UI tests
        run: node tests/competition-master-assessment-ui.test.js
      - name: Pitch-preserving time-stretch tests
        run: node tests/time-stretch-core.test.js
      - name: Signalsmith HQ adapter tests
        run: node tests/signalsmith-time-stretch.test.js
      - name: AudioContext engine integration tests
        run: node tests/audio-engine.integration.test.js
      - name: Offline renderer integration tests
        run: node tests/offline-render.integration.test.js
      - name: Preview/export pitch-preserving integration
        run: node tests/pitch-preserving.integration.test.js
      - name: 24-bit WAV encoder tests
        run: node tests/wav24.test.js
      - name: Lossless export architecture contract
        run: node tests/lossless-export-contract.test.js