name: JavaScript regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
      - name: Smart Mix alignment reliability gating tests
        run: node tests/smart-mix-alignment-reliability.test.js
      - name: Smart Mix alignment reliability summary tests
        run: node tests/smart-mix-alignment-summary-core.test.js
      - name: Smart Mix alignment reliability UI tests
        run: node tests/smart-mix-alignment-ui.test.js
      - name: Smart Mix source section purpose ranking tests
        run: node tests/smart-mix-section-purpose-ranking.test.js
      - name: Smart Mix selection explanation preview tests
        run: node tests/smart-mix-selection-explanation-preview.test.js
      - name: Smart Mix whole proposal quality tests
        run: node tests/smart-mix-whole-mix-quality-core.test.js
      - name: Smart Mix transition flow quality tests
        run: node tests/smart-mix-transition-flow-quality-core.test.js
      - name: Smart Mix whole quality transition integration tests
        run: node tests/smart-mix-whole-quality-transition-integration.test.js
      - name: Smart Mix whole quality workflow integration tests
        run: node tests/smart-mix-workflow-whole-quality.test.js
      - name: Smart Mix whole quality preview tests
        run: node tests/smart-mix-quality-preview-ui.test.js
      - name: Smart Mix runner-up comparison view tests
