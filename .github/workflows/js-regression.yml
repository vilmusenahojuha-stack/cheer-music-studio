name: JavaScript regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
      - name: Audio timing regression tests
        run: node tests/audio-timing-core.test.js
      - name: Shared DSP regression tests
        run: node tests/mix-dsp-core.test.js
      - name: AudioContext engine integration tests
        run: node tests/audio-engine.integration.test.js
      - name: Offline renderer integration tests
        run: node tests/offline-render.integration.test.js
      - name: 24-bit WAV encoder tests
        run: node tests/wav24.test.js
      - name: Lossless export architecture contract
        run: node tests/lossless-export-contract.test.js
